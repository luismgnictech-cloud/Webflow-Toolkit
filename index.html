<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="Generate SEO-friendly image filenames and accessible alt text for Webflow Templates.">
  <title>SEO Alt Text Generator | Webflow Toolkit</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; background: #f7f8fa; color: #18212e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 72px 0 96px; }
    .eyebrow { color: #5367b0; font-size: .76rem; letter-spacing: .13em; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 12px 0 12px; font-size: clamp(2rem, 4.4vw, 3.15rem); letter-spacing: -.045em; line-height: 1.08; }
    .intro { max-width: 690px; margin: 0; font-size: 1.03rem; line-height: 1.65; color: #586576; }
    .panel { margin-top: 36px; padding: 32px; border: 1px solid #e3e7ee; border-radius: 20px; background: #fff; box-shadow: 0 12px 36px rgba(32, 43, 65, .035); }
    .field + .field { margin-top: 24px; }
    label { display: block; margin-bottom: 10px; font-weight: 700; font-size: .92rem; }
    input, textarea { display: block; width: 100%; min-width: 0; padding: 14px 16px; border: 1px solid #cdd5df; border-radius: 11px; background: #fff; color: #18212e; line-height: 1.55; outline: none; transition: border-color .18s, box-shadow .18s; }
    input::placeholder, textarea::placeholder { color: #758193; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #9bb7ff; outline-offset: 2px; border-color: #4769da; }
    input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: #ba3646; }
    .description { min-height: 126px; resize: vertical; }
    .hint, .card-description { margin: 10px 0 18px; }
    .hint { margin: 8px 0 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .btn { border: 1px solid #d4dbe5; border-radius: 10px; padding: 12px 17px; background: #fff; color: #263449; font-weight: 700; line-height: 1.2; transition: background .18s, border-color .18s, transform .18s; }
    .btn:hover { background: #edf1f8; border-color: #b9c5d4; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { color: #fff; background: #3454cc; border-color: #3454cc; }
    .btn-primary:hover { color: #fff; background: #2847ba; border-color: #2847ba; }
    .message { min-height: 1.5em; margin: 13px 0 0; color: #ad3040; font-size: .88rem; font-weight: 650; }
    .output-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
    .output-card { display: flex; flex-direction: column; min-width: 0; padding: 22px; border: 1px solid #e3e7ee; border-radius: 14px; background: #fff; }
    .output-card h2 { margin: 0; font-size: 1.18rem; letter-spacing: -.02em; }
    .card-description { min-height: 2.9em; margin: 10px 0 18px; }
    .output-card textarea { min-height: 100px; flex: 1; resize: vertical; overflow-wrap: anywhere; }
    .output-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .counter { color: #536274; font-size: .85rem; font-variant-numeric: tabular-nums; }
    .counter.limit { color: #ac3040; font-weight: 700; }
    .copy-message { min-height: 1.4em; margin: 12px 0 0; color: #176346; font-size: .85rem; font-weight: 650; }
    .result-row { margin-top: 20px; padding: 24px; background: #f2f5fa; border: 1px solid #e3e7ee; border-radius: 18px; min-width: 0; }
    .result-heading { margin: 0; overflow-wrap: anywhere; font-size: 1.05rem; }
    .result-index { color: #5367b0; font-weight: 750; font-size: .8rem; margin: 0 0 6px; }
    .results-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 32px; }
    .results-header h2 { margin: 0; }
    .result-row .output-grid { margin-top: 16px; }
    .empty-state { color: #607082; }
    @media (max-width: 767px) { .page { width: min(100% - 32px, 560px); padding: 44px 0 56px; } .panel { padding: 22px; margin-top: 26px; } .output-grid { grid-template-columns: 1fr; gap: 14px; } .output-card { padding: 22px; } .card-description { min-height: 0; } }
    @media (max-width: 390px) { .page { width: calc(100% - 24px); } .panel, .output-card, .result-row { padding: 16px; border-radius: 14px; } .actions .btn { width: 100%; } .output-footer .btn { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Webflow Toolkit</div>
      <h1>SEO Alt Text Generator</h1>
      <p class="intro">Generate SEO-friendly image filenames and accessible alt text for your Webflow Templates.</p>
    </header>
    <section class="panel" aria-label="Generator inputs">
      <div class="field">
        <label for="templateName">Template Name</label>
        <input id="templateName" type="text" placeholder="Enter your Webflow Template name..." autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="imageDescription">Image Descriptions</label>
        <textarea id="imageDescription" class="description" placeholder="Enter one image heading per line...&#10;Introducing the template marketplace&#10;Building your first customer support agent&#10;Agent monitoring dashboard V2" aria-describedby="descriptionHint"></textarea>
        <p class="hint" id="descriptionHint">Enter one heading per line. Each line generates its own editable filename and alt text. Blank lines are ignored.</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="generate">Generate SEO Text</button>
        <button class="btn" type="button" id="clearDescription">Clear Description</button>
        <button class="btn" type="button" id="resetAll">Reset All</button>
      </div>
      <p class="message" id="validation" role="status" aria-live="polite"></p>
    </section>
    <section aria-label="Generated results" id="resultsSection" hidden>
      <div class="results-header"><h2 id="resultsTitle">Generated Results</h2><button class="btn" type="button" id="copyAll">Copy All Results</button></div>
      <div id="results"></div>
      <p id="batchMessage" class="copy-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    "use strict";
    const MAX = 100;
    const $ = (id) => document.getElementById(id);
    const templateInput = $("templateName");
    const descriptionInput = $("imageDescription");
    const validation = $("validation");
    const results = $("results");
    const resultsSection = $("resultsSection");
    const timers = new Map();
    let entries = [];
    let lastSource = "";
    let lastTemplate = "";
    let currentError = "";

    function words(value) {
      return value.normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/([a-z\d])([A-Z])/g, "$1 $2")
        .replace(/[_\u2010-\u2015-]+/g, " ")
        .replace(/[^a-zA-Z0-9\s]/g, " ")
        .trim().split(/\s+/).filter(Boolean);
    }
    function slug(value) { return words(value).map(word => word.toLowerCase()).join("-"); }
    function title(value) {
      return words(value).map(word => {
        if (/^[A-Z0-9]{2,5}$/.test(word) && /[A-Z]/.test(word)) return word;
        return word[0].toUpperCase() + word.slice(1).toLowerCase();
      }).join(" ");
    }
    function templateLabel(value) {
      return value.trim().replace(/\s+/g, " ").replace(/[_\u2010-\u2015-]+/g, " ");
    }
    function shorten(tokens, budget, separator) {
      const selected = [];
      const seen = new Set();
      for (const word of tokens) {
        const key = word.toLowerCase();
        if (seen.has(key)) continue;
        const candidate = [...selected, word].join(separator);
        if (candidate.length > budget) break;
        selected.push(word);
        seen.add(key);
      }
      return selected.join(separator);
    }
    function buildEntry(heading, template) {
      const nameSlug = slug(template);
      const fileSuffix = nameSlug + "-webflow-template";
      const altSuffix = templateLabel(template) + " Webflow Template";
      const fileBudget = MAX - fileSuffix.length - 1;
      const altBudget = MAX - altSuffix.length - 1;
      const fileDescription = shorten(words(heading).map(word => word.toLowerCase()), fileBudget, "-");
      const altDescription = shorten(words(title(heading)), altBudget, " ");
      if (!fileDescription || !altDescription) return null;
      return {heading, filename: fileDescription + "-" + fileSuffix, alt: altDescription + " " + altSuffix};
    }
    function setError(message, field) {
      currentError = message;
      validation.textContent = message;
      templateInput.removeAttribute("aria-invalid");
      descriptionInput.removeAttribute("aria-invalid");
      if (field) field.setAttribute("aria-invalid", "true");
    }
    function createElement(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function notify(element, message) {
      clearTimeout(timers.get(element));
      element.textContent = message;
      timers.set(element, setTimeout(() => element.textContent = "", 2500));
    }
    async function copy(value, message, success) {
      if (!value) return;
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
        else {
          const temp = createElement("textarea");
          temp.value = value;
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.append(temp);
          temp.select();
          const copied = document.execCommand("copy");
          temp.remove();
          if (!copied) throw new Error("Clipboard unavailable");
        }
        notify(message, success);
      } catch {
        notify(message, "Unable to copy automatically. Please select and copy the text.");
      }
    }
    function outputCard(entry, index, kind) {
      const isFilename = kind === "filename";
      const card = createElement("article", "output-card");
      const title = createElement("h3", "", isFilename ? "SEO Image Filename" : "Image Alt Text");
      const explanation = createElement("p", "card-description", isFilename ? "A clean, hyphen-separated filename optimized for search engines." : "A clear, descriptive, and accessible text alternative for your image.");
      const label = createElement("label", "", isFilename ? "Filename" : "Alt Text");
      const field = createElement("textarea");
      field.id = kind + "-" + index;
      field.maxLength = MAX;
      field.value = entry[kind];
      field.spellcheck = !isFilename;
      label.htmlFor = field.id;
      const footer = createElement("div", "output-footer");
      const count = createElement("span", "counter");
      count.id = kind + "-count-" + index;
      field.setAttribute("aria-describedby", count.id);
      const button = createElement("button", "btn btn-primary", isFilename ? "Copy Filename" : "Copy Alt Text");
      button.type = "button";
      const message = createElement("p", "copy-message");
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");
      function updateCounter() {
        const length = field.value.length;
        count.textContent = length + " / 100 characters" + (length === MAX ? " (limit reached)" : "");
        count.classList.toggle("limit", length === MAX);
      }
      field.addEventListener("input", () => {
        entry[kind] = field.value;
        updateCounter();
      });
      button.addEventListener("click", () => copy(field.value, message, isFilename ? "Filename copied to clipboard!" : "Alt text copied to clipboard!"));
      updateCounter();
      footer.append(count, button);
      card.append(title, explanation, label, field, footer, message);
      return card;
    }
    function render() {
      results.replaceChildren();
      resultsSection.hidden = entries.length === 0;
      $("resultsTitle").textContent = "Generated Results (" + entries.length + ")";
      entries.forEach((entry, index) => {
        const row = createElement("article", "result-row");
        row.append(createElement("p", "result-index", "IMAGE " + (index + 1)), createElement("h3", "result-heading", entry.heading));
        const grid = createElement("div", "output-grid");
        grid.append(outputCard(entry, index, "filename"), outputCard(entry, index, "alt"));
        row.append(grid);
        results.append(row);
      });
    }
    function generate(showErrors = false, force = false) {
      const source = descriptionInput.value;
      const template = templateInput.value;
      if (!force && source === lastSource && template === lastTemplate) return;
      lastSource = source;
      lastTemplate = template;
      setError("", null);
      const headings = source.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      if (!template.trim() || headings.length === 0) {
        entries = [];
        render();
        if (showErrors) setError(!template.trim() ? "Please enter your template name." : "Please enter an image description.", !template.trim() ? templateInput : descriptionInput);
        return;
      }
      const nameSlug = slug(template);
      if (!nameSlug) {
        entries = []; render();
        setError("Please enter a valid template name.", templateInput);
        return;
      }
      const suffixFileBudget = MAX - (nameSlug + "-webflow-template").length - 1;
      const suffixAltBudget = MAX - (templateLabel(template) + " Webflow Template").length - 1;
      if (suffixFileBudget < 1 || suffixAltBudget < 1) {
        entries = []; render();
        setError("Your template name is too long. Please shorten it to keep the generated text within 100 characters.", templateInput);
        return;
      }
      const invalid = [];
      entries = headings.map((heading, index) => {
        const entry = buildEntry(heading, template);
        if (!entry) invalid.push(index + 1);
        return entry;
      }).filter(Boolean);
      render();
      if (invalid.length) setError("Could not generate a description for line(s) " + invalid.join(", ") + ". Please use descriptive words or shorten your template name.", descriptionInput);
    }
    templateInput.addEventListener("input", () => generate());
    descriptionInput.addEventListener("input", () => generate());
    $("generate").addEventListener("click", () => generate(true, true));
    $("clearDescription").addEventListener("click", () => {
      descriptionInput.value = "";
      generate(false, true);
      descriptionInput.focus();
    });
    $("resetAll").addEventListener("click", () => {
      templateInput.value = "";
      descriptionInput.value = "";
      generate(false, true);
      templateInput.focus();
    });
    $("copyAll").addEventListener("click", () => {
      const text = entries.map((entry, index) => (index + 1) + ". " + entry.heading + "\nFilename: " + entry.filename + "\nAlt Text: " + entry.alt).join("\n\n");
      copy(text, $("batchMessage"), "All results copied to clipboard!");
    });
  </script>
</body>
</html>

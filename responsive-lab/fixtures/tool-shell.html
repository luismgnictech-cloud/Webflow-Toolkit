<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA del propio Responsive Lab</title><style>body{margin:16px;font:14px system-ui;background:#eef1f8}header{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}button{padding:10px}iframe{height:1400px;border:1px solid #627ddb;background:white;display:block}output{display:block;margin:12px 0}</style><header><strong>Contenedor de QA: dimensiones CSS reales de la herramienta</strong><button data-width="320">Móvil 320</button><button data-width="768">Tablet 768</button><button data-width="1440">Desktop 1440</button></header><output>320 CSS px</output><iframe title="Responsive Lab en contenedor de prueba" width="320" src="../../responsive-lab.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('output').textContent=b.dataset.width+' CSS px';});</script></html>

services:
  - type: web
    name: webflow-toolkit-site-qa
    runtime: docker
    plan: free
    dockerfilePath: ./site-qa-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://luismgnictech-cloud.github.io
      - key: MAX_PAGES
        value: 100
      - key: MAX_CONCURRENCY
        value: 2
      - key: MAX_RUNTIME_MS
        value: 180000
      - key: MAX_RESOURCE_BYTES
        value: 8000000

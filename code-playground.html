<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Playground | Webflow Toolkit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#e5e9f2;font:14px system-ui,sans-serif}button,select,input{font:inherit}a{color:#aebfff;text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid #303542}nav div{display:flex;gap:22px;flex-wrap:wrap}.brand{font-weight:800;color:white}[aria-current]{color:white;font-weight:700}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px}h1{font-size:18px;margin:0 auto 0 0}.btn,select{color:#e5e9f2;background:#252a36;border:1px solid #404757;border-radius:7px;padding:8px 12px;cursor:pointer}.primary{background:#3454cc;border-color:#4969e2}.toolbar label{display:flex;gap:6px;align-items:center}.help{color:#a4adbf;margin:0;padding:0 24px 14px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);height:calc(100dvh - 166px);min-height:650px;border-top:1px solid #303542}.editors{display:flex;flex-direction:column;min-width:0;resize:horizontal;overflow:auto;border-right:1px solid #424a5a}.editor{flex:1;display:flex;flex-direction:column;min-height:0;border-bottom:1px solid #303542}.editor header,.preview-bar,.console-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1c2029;padding:9px 14px}.editor label{font-weight:700}.editor span{font-size:11px;color:#9ba6ba}textarea{display:block;flex:1;width:100%;min-height:80px;resize:none;border:0;padding:16px;background:#12151b;color:#d8e4ff;tab-size:2;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:auto}textarea:focus{outline:2px solid #5575df;outline-offset:-2px}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #8fa9ff;outline-offset:3px}.preview{display:flex;flex-direction:column;min-width:0;overflow:hidden}.stage{flex:1;min-height:250px;overflow:auto;display:flex;justify-content:center;background:#303644;padding:12px}iframe{height:100%;width:100%;flex-shrink:0;border:0;background:#fff}.console{height:160px;min-height:80px;overflow:auto;padding:10px 14px;font:12px/1.6 ui-monospace,monospace}.console div{white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #252a36;padding:3px 0}.console .error{color:#ff929b}.console .warn{color:#ffd386}#status{color:#aebfff;font-size:12px}.console-bar button{padding:3px 9px;font-size:12px}@media(max-width:800px){.workspace{display:flex;flex-direction:column;height:auto;min-height:0}.editors{height:760px;resize:none}.preview{height:650px}.toolbar,nav{padding:14px}.help{padding:0 14px 14px}.stage{justify-content:flex-start}h1{width:100%}}
[hidden]{display:none!important}.editor.is-collapsed{flex:0 0 auto}.editor header{padding:0}.panel-toggle{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;padding:10px 14px;background:transparent;color:inherit;text-align:left;font-weight:700;cursor:pointer}.panel-toggle::before{content:"▾";color:#aebfff}.panel-toggle[aria-expanded="false"]::before{content:"▸"}.panel-toggle span{margin-left:auto}.preview-bar,.console-bar{padding:0 14px 0 0}.console-bar .panel-toggle{padding:10px 14px;font-size:14px}.preview-bar select{max-width:55%}
</style>
</head>
<body>
<nav aria-label="Toolkit navigation"><a class="brand" href="./">Webflow Toolkit</a><div><a href="./">SEO Alt Text Generator</a><a href="./image-compressor.html">Image Compressor</a><a href="./code-playground.html" aria-current="page">Code Playground</a></div></nav>
<div class="toolbar"><h1>Code Playground</h1><span id="status" role="status">Ready</span><label><input type="checkbox" id="auto" checked>Auto-run</label><button class="btn primary" id="run">Run code</button><button class="btn" id="export">Download HTML</button><button class="btn" id="reset">Reset</button></div>
<p class="help">HTML accepts body content or a full document. CSS and JS are added automatically—no style or script tags needed. Saved in this browser. Ctrl/Cmd + Enter to run.</p>
<main class="workspace"><section class="editors" aria-label="Code editors">
<div class="editor"><header><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="html">HTML<span>index.html</span></button></header><textarea id="html" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="HTML code"></textarea></div>
<div class="editor"><header><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="css">CSS<span>style.css</span></button></header><textarea id="css" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="CSS code"></textarea></div>
<div class="editor"><header><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="js">JavaScript<span>script.js</span></button></header><textarea id="js" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="JavaScript code"></textarea></div>
</section><section class="preview" aria-label="Live preview"><div class="preview-bar"><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="stage">Live preview</button><select id="viewport" aria-label="Preview width"><option value="100%">Responsive</option><option value="1440px">Desktop · 1440 px</option><option value="768px">Tablet · 768 px</option><option value="375px">Mobile · 375 px</option><option value="320px">Mobile · 320 px</option></select></div><div class="stage" id="stage"></div><div class="console-bar"><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="console">Console</button><button class="btn" id="clear">Clear</button></div><div class="console" id="console" role="log" aria-label="Console output"></div></section></main>
<script src="./code-playground.js"></script>
</body></html>
